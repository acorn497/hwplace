services:
  app:
    build: .
    command: sh -c "npx prisma db push && node dist/src/main"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:1234@mysql:3306/hwplace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=1234

      # 인증
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_BEFORE_DEPLOY}

      # 캔버스
      # 주의: 기존 데이터보다 작게 줄이면 범위 밖 픽셀은 화면에서 사라진다.
      # (이력은 canvas_events 에 남으므로 크기를 되돌리면 복원된다)
      - CHUNK_SIZE=64
      - CANVAS_SIZE_X=1024
      - CANVAS_SIZE_Y=1024

      # 워커
      # 코드가 읽는 이름은 WORKER_BATCH_SIZE 다.
      - WORKER_BATCH_SIZE=750
      - WORKER_MAX_RETRY=3

      # 요청 본문 크기
      # 픽셀 하나가 JSON 약 65바이트라, 50mb 면 요청 하나에 80만 픽셀(캔버스의 77%)이 담긴다.
      # 컨트롤러가 개수를 세기 전에 파싱이 끝나므로 입구에서 줄인다.
      - BODY_SIZE_LIMIT=4mb

      # 칠하기 쿼터 (유저별) — 3분당 5,000 픽셀
      - PAINT_QUOTA_WINDOW_SECONDS=180
      - PAINT_QUOTA_PIXELS=5000

      # 자동 제재 
      - PAINT_AUTO_RESTRICT=true
      - PAINT_ABUSE_STRIKES=20
      - PAINT_ABUSE_WINDOW_SECONDS=300

      # 신규 계정 쿼터 (가입 후 24시간은 낮은 한도 → 계정 찍어내기 무력화)
      - PAINT_QUOTA_NEW_ACCOUNT_PIXELS=1000
      - PAINT_NEW_ACCOUNT_HOURS=24

      # IP 단위 픽셀 총량 (계정과 무관한 축)
      - PAINT_QUOTA_IP_PIXELS=15000

      # 앞단 프록시가 있을 때만 true. 없이 켜면 XFF 위조로 IP 한도가 무력화된다.
      - TRUST_PROXY=false

      # 샌드박스 캔버스 (봇/스크립트용 무제한 구역)
      # 본 캔버스와 분리된 공간. 매시 정각 초기화되고 리플레이 이력을 남기지 않는다.
      - SANDBOX_SIZE_X=512
      - SANDBOX_SIZE_Y=512
      - SANDBOX_RESET_MINUTES=60
      - SANDBOX_GAP=64
      - SANDBOX_MAX_PIXELS_PER_REQUEST=50000

      # IP별 요청 수 제한 (초 / 분 / 시간)
      - THROTTLE_SHORT=20
      - THROTTLE_MEDIUM=300
      - THROTTLE_LONG=5000
      # 회원가입은 bcrypt 때문에 1건에 1.7초쯤 걸려 위 창들에 걸리지 않는다.
      # 계정을 대량으로 찍어 유저별 쿼터를 우회하는 것을 막는 별도 제한이다.
      - THROTTLE_REGISTER=5
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass 1234
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=hwplace
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:
